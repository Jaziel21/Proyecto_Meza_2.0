<!-- app_Libreria/templates/auth/login_cliente.html -->
{% extends 'base.html' %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">👤</div>
            <h2>Iniciar Sesión - Cliente</h2>
            <p class="login-subtitle">Accede a tu cuenta para comprar libros</p>
        </div>
        
        <div class="login-body">
            {% if messages %}
            <div class="messages-container">
                {% for message in messages %}
                <div class="alert alert-error">
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}
            
            <form method="post" class="login-form">
                {% csrf_token %}
                
                <div class="form-group">
                    <label class="form-label">Usuario</label>
                    <input type="text" class="form-control" name="username" required 
                           placeholder="Ingresa tu usuario" id="username-input">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" name="password" required 
                           placeholder="Ingresa tu contraseña" id="password-input">
                    <div class="password-toggle">
                        <button type="button" class="toggle-btn" id="togglePassword">
                            👁️
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-login">
                    <span class="btn-text">Iniciar Sesión</span>
                    <span class="btn-icon">→</span>
                </button>
            </form>
            
            <div class="login-footer">
                <a href="{% url 'login_selector' %}" class="back-link">
                    <span class="back-icon">←</span>
                    Volver al selector
                </a>
            </div>
        </div>
    </div>
</div>

<style>
/* Variables CSS */
:root {
    --verde-principal: #2e8b57;
    --verde-claro: rgba(46, 139, 87, 0.1);
    --verde-hover: #247449;
    --blanco: #ffffff;
    --gris-claro: #f8f9fa;
    --gris-medio: #e9ecef;
    --gris-oscuro: #343a40;
    --texto: #212529;
    --texto-secundario: #6c757d;
    --error: #dc3545;
    --error-claro: rgba(220, 53, 69, 0.1);
    --sombra: 0 4px 12px rgba(0, 0, 0, 0.1);
    --sombra-hover: 0 8px 24px rgba(0, 0, 0, 0.15);
    --radio-borde: 12px;
    --radio-input: 8px;
}

/* Contenedor principal */
.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    padding: 20px;
    background: linear-gradient(135deg, var(--gris-claro) 0%, var(--blanco) 100%);
}

/* Tarjeta de login */
.login-card {
    background: var(--blanco);
    border-radius: var(--radio-borde);
    box-shadow: var(--sombra);
    width: 100%;
    max-width: 400px;
    overflow: hidden;
    animation: slideUp 0.5s ease-out;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Header del login */
.login-header {
    background: linear-gradient(135deg, var(--verde-principal), #3cb371);
    color: white;
    padding: 35px 25px 25px;
    text-align: center;
}

.login-icon {
    font-size: 42px;
    margin-bottom: 15px;
    display: inline-block;
}

.login-header h2 {
    margin: 0 0 8px;
    font-size: 24px;
    font-weight: 600;
}

.login-subtitle {
    margin: 0;
    opacity: 0.9;
    font-size: 14px;
    font-weight: 400;
}

/* Cuerpo del login */
.login-body {
    padding: 30px 25px;
}

/* Mensajes de error */
.messages-container {
    margin-bottom: 20px;
}

.alert {
    padding: 12px 15px;
    border-radius: var(--radio-input);
    margin-bottom: 8px;
    animation: slideIn 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.alert-error {
    background-color: var(--error-claro);
    color: var(--error);
    border: 1px solid rgba(220, 53, 69, 0.3);
}

.alert-error::before {
    content: '⚠️';
    font-size: 16px;
}

/* Formulario */
.login-form {
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 20px;
    position: relative;
}

.form-label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: var(--texto);
    font-size: 14px;
}

.form-control {
    width: 100%;
    padding: 12px 40px 12px 12px;
    border: 2px solid var(--gris-medio);
    border-radius: var(--radio-input);
    font-size: 15px;
    transition: all 0.3s ease;
    background: var(--blanco);
    font-family: inherit;
    box-sizing: border-box;
    display: block;
    opacity: 1 !important; /* Forzar visibilidad */
    transform: none !important; /* Prevenir transformaciones */
}

.form-control:focus {
    outline: none;
    border-color: var(--verde-principal);
    box-shadow: 0 0 0 3px rgba(46, 139, 87, 0.15);
}

/* Botón para mostrar/ocultar contraseña */
.password-toggle {
    position: absolute;
    right: 12px;
    top: 35px;
}

.toggle-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    padding: 4px;
    color: var(--texto-secundario);
    transition: color 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
}

.toggle-btn:hover {
    color: var(--verde-principal);
    background: var(--verde-claro);
}

/* Botón de login */
.btn-login {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--verde-principal), #3cb371);
    color: white;
    border: none;
    border-radius: var(--radio-input);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    position: relative;
    overflow: hidden;
}

.btn-login:hover {
    background: linear-gradient(135deg, var(--verde-hover), var(--verde-principal));
    transform: translateY(-2px);
    box-shadow: var(--sombra-hover);
}

.btn-login:active {
    transform: translateY(0);
}

.btn-text {
    font-size: 15px;
    font-weight: 600;
}

.btn-icon {
    font-size: 16px;
    transition: transform 0.3s ease;
}

.btn-login:hover .btn-icon {
    transform: translateX(5px);
}

/* Footer del login */
.login-footer {
    text-align: center;
    padding-top: 20px;
    border-top: 1px solid var(--gris-medio);
}

.back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--verde-principal);
    text-decoration: none;
    font-weight: 500;
    font-size: 14px;
    transition: all 0.2s ease;
    padding: 6px 12px;
    border-radius: var(--radio-input);
}

.back-link:hover {
    color: var(--verde-hover);
    background: var(--verde-claro);
}

.back-icon {
    font-size: 16px;
}

/* Efectos de validación */
.form-control.error {
    border-color: var(--error);
    background-color: rgba(220, 53, 69, 0.05);
    animation: shake 0.5s ease;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
    20%, 40%, 60%, 80% { transform: translateX(5px); }
}

/* Estado de carga */
.btn-loading {
    position: relative;
    color: transparent !important;
}

.btn-loading::after {
    content: '';
    position: absolute;
    width: 18px;
    height: 18px;
    top: 50%;
    left: 50%;
    margin-top: -9px;
    margin-left: -9px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Placeholder estilizado */
.form-control::placeholder {
    color: var(--texto-secundario);
    opacity: 0.7;
    font-size: 14px;
}

/* Efecto de enfoque para inputs */
.form-control:focus {
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(46, 139, 87, 0.4); }
    70% { box-shadow: 0 0 0 4px rgba(46, 139, 87, 0); }
    100% { box-shadow: 0 0 0 0 rgba(46, 139, 87, 0); }
}

/* Indicador de campo requerido */
.form-label::after {
    content: ' *';
    color: var(--error);
    font-weight: bold;
    font-size: 12px;
}

/* Responsive */
@media (max-width: 768px) {
    .login-container {
        padding: 15px;
    }
    
    .login-card {
        max-width: 350px;
    }
    
    .login-header {
        padding: 25px 20px 20px;
    }
    
    .login-body {
        padding: 25px 20px;
    }
    
    .login-icon {
        font-size: 36px;
    }
    
    .login-header h2 {
        font-size: 22px;
    }
}

@media (max-width: 480px) {
    .login-card {
        max-width: 100%;
    }
    
    .login-header {
        padding: 20px 15px 15px;
    }
    
    .login-body {
        padding: 20px 15px;
    }
    
    .login-icon {
        font-size: 32px;
    }
    
    .login-header h2 {
        font-size: 20px;
    }
    
    .form-control {
        padding: 10px 35px 10px 10px;
        font-size: 14px;
    }
    
    .btn-login {
        padding: 12px;
    }
}

/* Asegurar que los inputs sean visibles */
#username-input, 
#password-input {
    opacity: 1 !important;
    visibility: visible !important;
    display: block !important;
    position: static !important;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('.login-form');
    const usernameInput = document.getElementById('username-input');
    const passwordInput = document.getElementById('password-input');
    const toggleBtn = document.getElementById('togglePassword');
    const loginBtn = document.querySelector('.btn-login');
    
    console.log('👤 Elementos cargados:');
    console.log('   - Username input:', usernameInput);
    console.log('   - Password input:', passwordInput);
    
    // Asegurar que los inputs sean visibles
    usernameInput.style.opacity = '1';
    usernameInput.style.visibility = 'visible';
    usernameInput.style.display = 'block';
    
    passwordInput.style.opacity = '1';
    passwordInput.style.visibility = 'visible';
    passwordInput.style.display = 'block';
    
    // Mostrar/ocultar contraseña
    if (toggleBtn) {
        toggleBtn.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
        });
    }
    
    // Validación en tiempo real
    usernameInput.addEventListener('blur', function() {
        if (this.value.trim() === '') {
            this.classList.add('error');
        } else {
            this.classList.remove('error');
        }
    });
    
    passwordInput.addEventListener('blur', function() {
        if (this.value.trim() === '') {
            this.classList.add('error');
        } else {
            this.classList.remove('error');
        }
    });
    
    // Validación al enviar el formulario
    form.addEventListener('submit', function(e) {
        let hasError = false;
        
        // Validar usuario
        if (!usernameInput.value.trim()) {
            usernameInput.classList.add('error');
            hasError = true;
        }
        
        // Validar contraseña
        if (!passwordInput.value.trim()) {
            passwordInput.classList.add('error');
            hasError = true;
        }
        
        if (hasError) {
            e.preventDefault();
            
            // Mostrar mensaje de error si no hay mensajes del servidor
            if (!document.querySelector('.alert-error')) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'alert alert-error';
                errorDiv.innerHTML = '<span>Por favor, completa todos los campos.</span>';
                
                const messagesContainer = document.querySelector('.messages-container');
                if (messagesContainer) {
                    messagesContainer.appendChild(errorDiv);
                } else {
                    form.parentNode.insertBefore(errorDiv, form);
                }
                
                // Remover después de 3 segundos
                setTimeout(() => {
                    errorDiv.remove();
                }, 3000);
            }
            
            // Enfocar el primer campo con error
            if (usernameInput.classList.contains('error')) {
                usernameInput.focus();
            } else if (passwordInput.classList.contains('error')) {
                passwordInput.focus();
            }
        } else {
            // Mostrar estado de carga
            loginBtn.classList.add('btn-loading');
            loginBtn.disabled = true;
            loginBtn.querySelector('.btn-text').textContent = 'Ingresando...';
            
            // Simular delay de red (solo para efecto visual)
            setTimeout(() => {
                loginBtn.classList.remove('btn-loading');
                loginBtn.disabled = false;
                loginBtn.querySelector('.btn-text').textContent = 'Iniciar Sesión';
            }, 1500);
        }
    });
    
    // Auto-focus en el primer campo
    setTimeout(() => {
        usernameInput.focus();
    }, 100);
    
    // Limpiar error al escribir
    usernameInput.addEventListener('input', function() {
        if (this.value.trim()) {
            this.classList.remove('error');
        }
    });
    
    passwordInput.addEventListener('input', function() {
        if (this.value.trim()) {
            this.classList.remove('error');
        }
    });
    
    // Prevenir múltiples envíos
    let isSubmitting = false;
    form.addEventListener('submit', function(e) {
        if (isSubmitting) {
            e.preventDefault();
            return;
        }
        isSubmitting = true;
        
        // Resetear después de 3 segundos por si hay error
        setTimeout(() => {
            isSubmitting = false;
        }, 3000);
    });
    
    // Navegación por teclado
    usernameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            passwordInput.focus();
        }
    });
    
    passwordInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !loginBtn.disabled) {
            e.preventDefault();
            form.dispatchEvent(new Event('submit'));
        }
    });
    
    // Recordar usuario (localStorage)
    const savedUsername = localStorage.getItem('cliente_username');
    if (savedUsername) {
        usernameInput.value = savedUsername;
    }
    
    // Guardar usuario al enviar
    form.addEventListener('submit', function() {
        if (usernameInput.value.trim()) {
            localStorage.setItem('cliente_username', usernameInput.value.trim());
        }
    });
    
    // Log de acceso
    console.log('👤 Login Cliente - Formulario listo');
});
</script>
{% endblock %}
